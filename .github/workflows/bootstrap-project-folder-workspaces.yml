name: Bootstrap project-folder workspaces

on:
  push:
    branches:
      - feat/project-folder-workspaces
    paths:
      - .github/workflows/bootstrap-project-folder-workspaces.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/project-folder-bootstrap.py.gz.b64 | gzip -d > /tmp/project-folder-bootstrap.py
          python3 /tmp/project-folder-bootstrap.py

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            studio/backend/routes/chat_history.py \
            studio/backend/storage/studio_db.py \
            studio/backend/tests/test_chat_history_storage.py \
            studio/backend/tests/test_project_workspace_location.py

      - name: Run frontend contract test
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            studio/frontend/tests/project-folder-workspace.test.ts

      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --check --edition 2021 \
            studio/src-tauri/src/native_backend_lease.rs \
            studio/src-tauri/src/native_path_policy.rs \
            studio/src-tauri/src/native_intents.rs \
            studio/src-tauri/src/main.rs

      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhilipJohnBasile"
          git config user.email "1419847+PhilipJohnBasile@users.noreply.github.com"
          git rm .github/workflows/bootstrap-project-folder-workspaces.yml
          git rm .github/project-folder-bootstrap.py.gz.b64
          git add -A
          git diff --cached --check
          git commit -m "Studio: use existing folders as project workspaces"
          git push origin HEAD:feat/project-folder-workspaces
