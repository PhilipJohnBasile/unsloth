# Deterministic host coverage for project-backed editing and command execution.
# This lane does not download a model or depend on a model choosing a tool.

name: Studio secure tools

on:
  pull_request:
    paths:
      - 'studio/backend/core/agent_workspace/**'
      - 'studio/backend/core/inference/tools.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/backend/tests/test_edit_file_tool.py'
      - 'studio/backend/tests/test_secure_cross_platform_tools.py'
      - '.github/workflows/studio-secure-tools-ci.yml'
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  focused:
    name: secure tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            boundary_required: '1'
          - os: windows-latest
            boundary_required: '0'
          - os: macos-15
            boundary_required: '1'

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: '1'
      UNSLOTH_SECURE_BOUNDARY_REQUIRED: ${{ matrix.boundary_required }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the Linux project boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Restore the pip cache
        id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: studio-secure-tools-${{ runner.os }}
          key-files: |
            pyproject.toml
            studio/backend/requirements/studio.txt
            .github/workflows/studio-secure-tools-ci.yml

      - name: Install focused backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r studio/backend/requirements/studio.txt
          python -m pip install \
            python-multipart aiofiles sqlalchemy psutil pyyaml requests \
            pytest pytest-timeout

      - name: Run secure project tool tests
        working-directory: studio/backend
        run: python -m pytest tests/test_secure_cross_platform_tools.py -q --tb=short --timeout=60

      - name: Save the pip cache
        if: always()
        uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}
